name: Deploy Backend & Build Docker

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/smart-mirror-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/smart-mirror-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-droplet:
    name: Optional Deploy to Droplet
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_DROPLET_IP: ${{ secrets.DO_DROPLET_IP }}
        if: env.DO_SSH_KEY != '' && env.DO_DROPLET_IP != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            if [ -d "/root/14DTE-Project/server" ]; then
              cd /root/14DTE-Project/server
              git pull origin main
              /usr/bin/go build -o smart-mirror-api
              systemctl restart smart-mirror-api
            fi