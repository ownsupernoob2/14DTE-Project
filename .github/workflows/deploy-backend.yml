name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      # Usually you will build the docker image here or SSH into a droplet.
      # If using DigitalOcean App Platform, DO detects the Dockerfile automatically and builds it.
      # This action uses SSH to deploy to a Droplet:

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/14DTE-Project/server
            git pull origin main
            /usr/bin/go build -o smart-mirror-api
            
            # Update the systemd service to ensure it runs the built executable instead of main.go
            cat << 'EOF' > /etc/systemd/system/smart-mirror-api.service
            [Unit]
            Description=Smart Mirror API
            After=network.target

            [Service]
            WorkingDirectory=/root/14DTE-Project/server
            ExecStart=/root/14DTE-Project/server/smart-mirror-api
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF
            
            systemctl daemon-reload
            systemctl restart smart-mirror-api